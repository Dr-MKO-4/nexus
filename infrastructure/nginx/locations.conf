# Routes partagées entre les serveurs HTTP (80) et HTTPS (443) de nginx.conf.

# --- API REST ---
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://langgraph_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Authentification : rate limiting renforcé anti-bruteforce ---
location /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;

    proxy_pass http://langgraph_api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- WebSocket (communication temps réel avec les agents) ---
location /ws/ {
    proxy_pass http://langgraph_api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Les connexions WebSocket restent ouvertes longtemps : timeout étendu
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Server-Sent Events (suivi des tâches longues) ---
location /sse/ {
    proxy_pass http://langgraph_api/sse/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE : désactiver le buffering pour que les événements arrivent en flux
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
}

# --- Modèles PyTorch internes ---
location /ml/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://pytorch_models/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# --- Monitoring Celery (Flower) ---
location /flower/ {
    proxy_pass http://flower_ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- Dashboards Grafana ---
location /grafana/ {
    proxy_pass http://grafana_ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- Automatisation n8n (WebSocket requis pour l'éditeur de workflows) ---
location /n8n/ {
    proxy_pass http://n8n_ui/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- Frontend (React/Vite buildé, servi par le conteneur frontend) ---
location / {
    proxy_pass http://nexus_frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
