# Reverse proxy NEXUS AI : point d'entrée unique vers l'API, le frontend et les
# outils marketing/monitoring internes. SSL-ready (certificats à monter dans
# /etc/nginx/certs  décommenter le server 443 une fois émis, ex. via certbot).

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # --- Rate limiting ---
    # Zone générale (API) : 10 req/s par IP, avec burst absorbant les pics légitimes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Zone stricte pour l'authentification : freine le bruteforce
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    limit_req_status 429;

    # --- Upstreams (noms de service Docker Compose, réseau nexus_network) ---
    upstream langgraph_api {
        server langgraph_api:8000;
        keepalive 32;
    }

    upstream pytorch_models {
        server pytorch_models:8001;
        keepalive 16;
    }

    upstream nexus_frontend {
        server frontend:80;
        keepalive 16;
    }

    upstream flower_ui {
        server flower:5555;
    }

    upstream grafana_ui {
        server grafana:3000;
    }

    upstream n8n_ui {
        server n8n:5678;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------
    # HTTP : redirection vers HTTPS en production.
    # En développement (pas de certificat monté), ce bloc sert
    # directement le trafic  voir docker-compose.override.yml.
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Décommenter une fois les certificats disponibles pour forcer HTTPS :
        # location / { return 301 https://$host$request_uri; }

        include /etc/nginx/conf.d/locations.conf;
    }

    # ------------------------------------------------------------
    # HTTPS  SSL ready. Fournir les certificats (Let's Encrypt / interne)
    # dans le volume monté sur /etc/nginx/certs avant d'activer ce bloc.
    # ------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/conf.d/locations.conf;
    }
}
