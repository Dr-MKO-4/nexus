[alembic]
# %(here)s se résout au dossier contenant ce fichier (backend/db/migrations),
# quel que soit le répertoire depuis lequel la commande `alembic` est lancée.
script_location = %(here)s
prepend_sys_path = %(here)s/../../..

# L'URL réelle est injectée dynamiquement depuis settings.DATABASE_URL dans
# env.py (voir get_url())  elle n'est pas dupliquée ici pour éviter la
# désynchronisation avec le .env actif.
sqlalchemy.url =

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
